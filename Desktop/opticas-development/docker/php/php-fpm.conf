; PHP-FPM Pool Configuration for Opticas-Development
; Optimized for production performance

[www]
; User and group
user = www
group = www

; Listen to Unix socket (faster than TCP)
listen = /var/run/php-fpm/php-fpm.sock
listen.owner = www
listen.group = www
listen.mode = 0660

; Process management
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Process control timeout (seconds)
pm.process_idle_timeout = 10s

; Request handling
request_terminate_timeout = 60
request_slowlog_timeout = 30
slowlog = /var/log/php-fpm/slow.log

; Error logging
php_admin_value[error_log] = /var/log/php-fpm/error.log
php_admin_flag[log_errors] = on
php_value[session.save_handler] = redis
php_value[session.save_path] = "tcp://redis:6379?auth=${REDIS_PASSWORD:-redis_password}"

; Performance tuning
php_value[expose_php] = off
php_value[display_errors] = off
php_value[display_startup_errors] = off
php_value[log_errors] = on
php_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Memory and execution
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M

; OPcache configuration
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.max_wasted_percentage] = 5
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.fast_shutdown] = 1
php_admin_value[opcache.enable_cli] = 0

; Security
php_admin_value[open_basedir] = /var/www/html:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
php_admin_value[allow_url_fopen] = on
php_admin_value[allow_url_include] = off

; Date timezone
php_admin_value[date.timezone] = America/Mexico_City

; Environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp

; Access log
access.log = /var/log/php-fpm/access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; Catch worker output
catch_workers_output = yes

; Clear environment
clear_env = no
